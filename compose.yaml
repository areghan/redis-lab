services:
  redis:
    image: redis:7
    container_name: redis-server
    ports:
      - "6379:6379"
    networks:
      - redis-network
    volumes:
      - redis-data:/data

  fastapi:
    image: redis-lab:v1
    container_name: fastapi-server
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis-server
      REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - redis-network

networks:
  redis-network:

volumes:
  redis-data: