apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-lab
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/areghan/redis-lab.git
    targetRevision: Main
    path: redis-lab-chart

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true